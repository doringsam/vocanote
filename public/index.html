<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocaNote - 나만의 스마트 영어 단어장</title>

  <!-- 가독성이 뛰어난 Pretendard 한글/영문 웹폰트 불러오기 -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    /* ==========================================================================
       1. 디자인 변수 설정 (색상, 그림자, 둥근 모서리 등)
       ========================================================================== */
    :root {
      --primary: #4f46e5;
      /* 메인 인디고 색상 */
      --primary-hover: #4338ca;
      /* 마우스를 올렸을 때 진해지는 색상 */
      --primary-light: #eef2ff;
      /* 연한 인디고 배경색 */
      --success: #10b981;
      /* 암기 완료(초록색) */
      --success-light: #ecfdf5;
      --danger: #ef4444;
      /* 삭제 버튼(빨간색) */
      --danger-light: #fef2f2;
      --text-main: #0f172a;
      /* 기본 진한 글자색 */
      --text-muted: #64748b;
      /* 보조 회색 글자색 */
      --bg-page: #f8fafc;
      /* 전체 배경색 */
      --bg-card: #ffffff;
      /* 카드 배경색 */
      --border-color: #e2e8f0;
      /* 테두리 색상 */
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ==========================================================================
       2. 상단 네비게이션 바 (헤더) 스타일
       ========================================================================== */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1024px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--primary);
    }

    .brand-badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-light);
    }

    /* ==========================================================================
       3. 공통 버튼 및 입력창 스타일
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: #ffffff;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover:not(:disabled) {
      background-color: #f1f5f9;
    }

    .btn-danger {
      background-color: var(--danger-light);
      color: var(--danger);
    }

    .btn-danger:hover:not(:disabled) {
      background-color: #fee2e2;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: 8px;
    }

    /* ==========================================================================
       4. 메인 레이아웃 및 로그인 전 안내 화면 (Hero)
       ========================================================================== */
    main {
      max-width: 1024px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .login-hero {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 56px 28px;
      text-align: center;
      box-shadow: var(--shadow-md);
      margin-top: 24px;
    }

    .login-hero h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .login-hero p {
      color: var(--text-muted);
      max-width: 520px;
      margin: 0 auto 28px;
      font-size: 1.02rem;
    }

    .feature-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .feature-pill {
      background: #f1f5f9;
      color: #334155;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ==========================================================================
       5. 로그인 후 단어장 화면 (통계 카드, 단어 입력 폼, 단어 그리드)
       ========================================================================== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }

    .stat-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text-main);
    }

    /* 단어 추가/수정 카드 */
    .editor-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .editor-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
    }

    .form-input {
      padding: 11px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .form-actions {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 필터 및 검색 툴바 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* 단어 목록 그리드 */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .word-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .word-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .word-card.memorized {
      border-left: 5px solid var(--success);
      background: #fcfffe;
    }

    .word-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .word-english-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .word-english {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      word-break: break-word;
    }

    .speak-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status-badge.done {
      background: var(--success-light);
      color: var(--success);
    }

    .status-badge.learning {
      background: #fef3c7;
      color: #d97706;
    }

    .word-korean {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1e293b;
      margin-top: 6px;
      transition: filter 0.2s ease;
    }

    /* 학습 모드(뜻 가리기) 활성화 시 블러 처리, 마우스를 올리면 보임 */
    .blind-mode .word-korean {
      filter: blur(7px);
      user-select: none;
    }

    .blind-mode .word-card:hover .word-korean {
      filter: blur(0);
    }

    .word-example {
      font-size: 0.88rem;
      color: var(--text-muted);
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid #cbd5e1;
      margin-top: 10px;
      word-break: break-word;
    }

    .word-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      gap: 8px;
    }

    .word-actions {
      display: flex;
      gap: 6px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-lg);
      color: var(--text-muted);
    }

    /* 알림 토스트 메시지 */
    #toastBox {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 1000;
    }

    #toastBox.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden {
      display: none !important;
    }

    /* 모바일 화면 대응 반응형 스타일 */
    @media (max-width: 640px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .header-inner {
        padding: 12px 16px;
      }

      main {
        padding: 20px 16px 48px;
      }
    }
  </style>
</head>

<body>

  <!-- ========================================================================
       상단 헤더 영역 (앱 로고 및 로그인/로그아웃 버튼)
       ======================================================================== -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <span>📘 VocaNote</span>
        <span class="brand-badge">나만의 단어장</span>
      </div>

      <!-- 로그인 상태에 따라 버튼이 바뀝니다 -->
      <div class="user-area">
        <!-- 로그인 후 보이는 사용자 프로필 및 로그아웃 버튼 -->
        <div id="userInfoBox" class="user-profile hidden">
          <img id="userPhoto" class="user-avatar" src="" alt="프로필" />
          <span id="userName">사용자</span>
          <button id="logoutBtn" class="btn btn-outline btn-sm" type="button">로그아웃</button>
        </div>

        <!-- 로그인 전 보이는 Google 로그인 버튼 -->
        <button id="headerLoginBtn" class="btn btn-primary btn-sm" type="button">
          Google 로그인
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ======================================================================
         [화면 1] 로그인 전 안내 화면 (비로그인 시 표시)
         ====================================================================== -->
    <section id="loginSection" class="login-hero">
      <h1>나만의 영어 단어장을 시작해 보세요</h1>
      <p>
        Google 계정으로 간편하게 로그인하고, 외우고 싶은 영단어와 예문을 기록하세요.<br />

      </p>

      <div class="feature-pills">
        <span class="feature-pill">🔒 개인별 철저한 데이터 분리</span>
        <span class="feature-pill">☁️ 언제 어디서나 이어서 학습</span>
        <span class="feature-pill">🔊 원어민 발음 듣기 & 뜻 가리기 모드</span>
      </div>

      <button id="heroLoginBtn" class="btn btn-primary" type="button" style="font-size: 1rem; padding: 14px 28px;">
        🚀 Google 계정으로 시작하기
      </button>
    </section>

    <!-- ======================================================================
         [화면 2] 로그인 후 메인 단어 학습 화면 (로그인 시 표시)
         ====================================================================== -->
    <section id="appSection" class="hidden">

      <!-- 1) 학습 현황 통계 요약 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">전체 등록 단어</div>
          <div id="statTotal" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">암기 완료 (Memorized)</div>
          <div id="statMemorized" class="stat-value" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">학습 중 (Learning)</div>
          <div id="statLearning" class="stat-value" style="color: #d97706;">0</div>
        </div>
      </div>

      <!-- 2) 새 단어 추가 및 기존 단어 수정 폼 -->
      <div class="editor-card">
        <div class="editor-header">
          <h2 id="formTitle" class="editor-title">✨ 새 영어 단어 추가하기</h2>
          <span style="font-size: 0.8rem; color: var(--text-muted);">저장 경로: <code
              id="userPathText">users/...</code></span>
        </div>

        <form id="wordForm">
          <!-- 수정 모드일 때 수정할 단어의 문서 ID를 임시 저장하는 숨김 칸 -->
          <input type="hidden" id="editWordId" value="" />

          <div class="form-grid">
            <div class="form-group">
              <label for="englishInput">영어 단어 / 숙어 *</label>
              <input type="text" id="englishInput" class="form-input" placeholder="예: resilient" maxlength="200"
                required />
            </div>

            <div class="form-group">
              <label for="koreanInput">한국어 뜻 *</label>
              <input type="text" id="koreanInput" class="form-input" placeholder="예: 회복력이 있는, 탄력 있는" maxlength="500"
                required />
            </div>

            <div class="form-group full-width">
              <label for="exampleInput">활용 예문 (선택)</label>
              <input type="text" id="exampleInput" class="form-input"
                placeholder="예: Children are often very resilient to change." maxlength="1000" />
            </div>
          </div>

          <div class="form-actions">
            <!-- 수정 모드일 때만 나타나는 '취소' 버튼 -->
            <button id="cancelEditBtn" type="button" class="btn btn-outline hidden">
              수정 취소
            </button>
            <button id="submitWordBtn" type="submit" class="btn btn-primary">
              + 단어장에 저장
            </button>
          </div>
        </form>
      </div>

      <!-- 3) 필터 탭, 검색창, 뜻 가리기 스위치 -->
      <div class="toolbar">
        <div class="filter-tabs">
          <button type="button" class="tab-btn active" data-filter="all">전체 보기</button>
          <button type="button" class="tab-btn" data-filter="learning">학습 중</button>
          <button type="button" class="tab-btn" data-filter="memorized">암기 완료</button>
        </div>

        <div class="toolbar-right">
          <input type="search" id="searchInput" class="form-input" placeholder="🔍 단어 또는 뜻 검색..."
            style="padding: 8px 12px; font-size: 0.88rem;" />
          <button id="blindToggleBtn" type="button" class="btn btn-outline btn-sm">
            🙈 뜻 가리기 (암기 테스트)
          </button>
        </div>
      </div>

      <!-- 4) 단어 카드 목록이 표시되는 영역 -->
      <div id="wordListContainer" class="word-grid">
        <div class="empty-state">데이터를 불러오는 중입니다...</div>
      </div>

    </section>
  </main>

  <!-- 화면 우측 하단 알림 토스트 -->
  <div id="toastBox">알림 메시지</div>

  <!-- ========================================================================
       JavaScript 로직: Firebase 연동 (로그인, 암호화, 단어 추가/수정/삭제/조회)
       ======================================================================== -->
  <script type="module">
    // 1. Firebase 공식 CDN에서 필요한 기능(모듈)들을 불러옵니다.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      collection,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // ========================================================================
    // 2. 내 Firebase 프로젝트("app261111") 연결 설정
    // ========================================================================
    const firebaseConfig = {
      projectId: "app261111",
      appId: "1:310298135636:web:fc1a9b1af217a0a1cab1c1",
      storageBucket: "app261111.firebasestorage.app",
      apiKey: "AIzaSyD4CTw0X0gBWJCT9TueQRQUb1e7yx4EZto",
      authDomain: "app261111.firebaseapp.com",
      messagingSenderId: "310298135636"
    };

    // Firebase 앱, 인증(Auth), 데이터베이스(Firestore)를 초기화합니다.
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // ========================================================================
    // 3. 보안 유틸리티 함수 (개인정보 암호화 및 XSS 공격 방지)
    // ========================================================================

    /**
     * [보안 규칙 준수] 사용자의 이메일 등 민감한 개인정보를 Firestore에 저장하기 전에
     * 브라우저 내장 암호화 기술(Web Crypto API AES-GCM)을 사용하여 안전하게 암호화합니다.
     */
    async function encryptPersonalData(plainText, userUid) {
      if (!plainText) return null;
      try {
        const encoder = new TextEncoder();
        // 사용자의 고유 UID를 기반으로 암호화 키 재료를 만듭니다.
        const keyMaterial = await window.crypto.subtle.importKey(
          "raw",
          encoder.encode(userUid.padEnd(32, "0").slice(0, 32)),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );

        // PBKDF2 알고리즘으로 강력한 256비트 AES-GCM 암호화 키를 생성합니다.
        const cryptoKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: encoder.encode("app261111-voca-salt"),
            iterations: 10000,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt"]
        );

        // 매번 다른 암호문이 나오도록 12바이트 무작위 초기화 벡터(IV)를 생성합니다.
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const encryptedBuffer = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          cryptoKey,
          encoder.encode(plainText)
        );

        // IV와 암호문을 합쳐서 Base64 문자열 형태로 반환합니다.
        const combined = new Uint8Array(iv.length + encryptedBuffer.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(encryptedBuffer), iv.length);
        return btoa(String.fromCharCode(...combined));
      } catch (err) {
        console.error("암호화 처리 중 오류:", err);
        return null;
      }
    }

    /**
     * 사용자가 입력한 텍스트에 악성 스크립트(<script> 등)가 섞여 있어도
     * 실행되지 않고 안전한 글자로만 보이게 변환하는 함수입니다.
     */
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ========================================================================
    // 4. 화면 요소(DOM) 찾아오기 및 상태 변수 선언
    // ========================================================================
    const loginSection = document.getElementById("loginSection");
    const appSection = document.getElementById("appSection");
    const userInfoBox = document.getElementById("userInfoBox");
    const userPhoto = document.getElementById("userPhoto");
    const userName = document.getElementById("userName");
    const headerLoginBtn = document.getElementById("headerLoginBtn");
    const heroLoginBtn = document.getElementById("heroLoginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userPathText = document.getElementById("userPathText");

    const wordForm = document.getElementById("wordForm");
    const formTitle = document.getElementById("formTitle");
    const editWordIdInput = document.getElementById("editWordId");
    const englishInput = document.getElementById("englishInput");
    const koreanInput = document.getElementById("koreanInput");
    const exampleInput = document.getElementById("exampleInput");
    const submitWordBtn = document.getElementById("submitWordBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");

    const wordListContainer = document.getElementById("wordListContainer");
    const statTotal = document.getElementById("statTotal");
    const statMemorized = document.getElementById("statMemorized");
    const statLearning = document.getElementById("statLearning");
    const searchInput = document.getElementById("searchInput");
    const blindToggleBtn = document.getElementById("blindToggleBtn");
    const tabButtons = document.querySelectorAll(".tab-btn");
    const toastBox = document.getElementById("toastBox");

    // 현재 로그인한 사용자 정보와 단어 목록을 담는 변수
    let currentUser = null;
    let unsubscribeWords = null; // 실시간 리스너 해제용 함수
    let allWords = [];           // Firestore에서 불러온 내 단어 배열
    let currentFilter = "all";   // 'all' | 'learning' | 'memorized'
    let isBlindMode = false;     // 뜻 가리기 모드 여부

    // 우측 하단에 잠깐 나타났다가 사라지는 알림창 함수
    let toastTimer = null;
    function showToast(message) {
      toastBox.textContent = message;
      toastBox.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastBox.classList.remove("show");
      }, 2600);
    }

    // ========================================================================
    // 5. Google 로그인 및 로그아웃 기능 구현
    // ========================================================================
    async function handleGoogleLogin() {
      try {
        await signInWithPopup(auth, googleProvider);
        showToast("반갑습니다! Google 계정으로 로그인되었습니다.");
      } catch (error) {
        console.error("로그인 오류:", error);
        if (error.code === "auth/popup-closed-by-user") {
          showToast("로그인 창이 닫혔습니다.");
        } else if (error.code === "auth/unauthorized-domain") {
          alert(
            "현재 접속한 도메인이 Firebase 승인 도메인에 등록되어 있지 않습니다.\n" +
            "Firebase 콘솔 > Authentication > Settings > 승인된 도메인에 현재 도메인(예: localhost)을 추가해 주세요."
          );
        } else {
          alert("로그인 중 오류가 발생했습니다: " + error.message);
        }
      }
    }

    async function handleLogout() {
      try {
        await signOut(auth);
        showToast("안전하게 로그아웃되었습니다.");
      } catch (error) {
        console.error("로그아웃 오류:", error);
      }
    }

    headerLoginBtn.addEventListener("click", handleGoogleLogin);
    heroLoginBtn.addEventListener("click", handleGoogleLogin);
    logoutBtn.addEventListener("click", handleLogout);

    // ========================================================================
    // 6. 로그인 상태 변화 감지 및 사용자별 데이터 연결 (핵심 로직)
    // ========================================================================
    onAuthStateChanged(auth, async (user) => {
      // 이전에 연결된 실시간 단어장 감지기가 있다면 먼저 해제합니다.
      if (unsubscribeWords) {
        unsubscribeWords();
        unsubscribeWords = null;
      }

      if (user) {
        // [로그인된 상태]
        currentUser = user;

        // 1) 상단 프로필 및 화면 전환
        loginSection.classList.add("hidden");
        appSection.classList.remove("hidden");
        headerLoginBtn.classList.add("hidden");
        userInfoBox.classList.remove("hidden");

        userName.textContent = user.displayName || "학습자님";
        userPhoto.src =
          user.photoURL ||
          "https://ui-avatars.com/api/?name=" + encodeURIComponent(user.displayName || "U");
        userPathText.textContent = `users/${user.uid}/words`;

        // 2) users/{userId} 문서에 내 기본 프로필 저장 (이메일은 암호화하여 저장!)
        try {
          const encryptedEmail = await encryptPersonalData(user.email, user.uid);
          const userDocRef = doc(db, "users", user.uid);
          await setDoc(
            userDocRef,
            {
              uid: user.uid,
              displayName: (user.displayName || "학습자").slice(0, 100),
              encryptedEmail: encryptedEmail,
              photoURL: (user.photoURL || "").slice(0, 1000),
              updatedAt: Date.now()
            },
            { merge: true }
          );
        } catch (profileErr) {
          console.warn("프로필 문서 갱신 참고:", profileErr);
        }

        // 3) 내 단어장(users/{userId}/words) 실시간 불러오기 시작
        subscribeToUserWords(user.uid);
      } else {
        // [로그아웃된 상태]
        currentUser = null;
        allWords = [];
        resetForm();

        loginSection.classList.remove("hidden");
        appSection.classList.add("hidden");
        headerLoginBtn.classList.remove("hidden");
        userInfoBox.classList.add("hidden");
      }
    });

    // ========================================================================
    // 7. Firestore 실시간 데이터 조회 (Read - onSnapshot)
    // ========================================================================
    function subscribeToUserWords(userId) {
      // 경로: users/{userId}/words 컬렉션을 최신 등록순(createdAt 내림차순)으로 가져옵니다.
      const wordsCollectionRef = collection(db, "users", userId, "words");
      const wordsQuery = query(wordsCollectionRef, orderBy("createdAt", "desc"));

      unsubscribeWords = onSnapshot(
        wordsQuery,
        (snapshot) => {
          // 데이터베이스에 변경이 생길 때마다 자동으로 이 함수가 실행됩니다.
          allWords = snapshot.docs.map((docSnap) => ({
            id: docSnap.id,
            ...docSnap.data()
          }));
          renderWordList();
        },
        (error) => {
          console.error("단어 목록 조회 오류:", error);
          wordListContainer.innerHTML = `
            <div class="empty-state">
              데이터를 불러오는 중 권한 오류가 발생했습니다: ${escapeHtml(error.message)}
            </div>
          `;
        }
      );
    }

    // ========================================================================
    // 8. 단어 추가(Create) 및 수정(Update) 처리
    // ========================================================================
    wordForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!currentUser) {
        alert("먼저 Google 계정으로 로그인해 주세요.");
        return;
      }

      const english = englishInput.value.trim();
      const korean = koreanInput.value.trim();
      const example = exampleInput.value.trim();
      const editWordId = editWordIdInput.value;

      if (!english || !korean) {
        alert("영어 단어와 한국어 뜻을 모두 입력해 주세요.");
        return;
      }

      submitWordBtn.disabled = true;

      try {
        const now = Date.now();

        if (editWordId) {
          // [수정 모드] 기존 단어를 찾아 내용을 업데이트합니다.
          const existingWord = allWords.find((w) => w.id === editWordId);
          const wordDocRef = doc(db, "users", currentUser.uid, "words", editWordId);

          await updateDoc(wordDocRef, {
            english: english,
            korean: korean,
            example: example,
            memorized: existingWord ? Boolean(existingWord.memorized) : false,
            // 보안 규칙에서 최초 생성일(createdAt)이 변조되지 않도록 보호하므로 그대로 유지합니다.
            createdAt: existingWord ? existingWord.createdAt : now,
            updatedAt: now
          });

          showToast("✏️ 단어 정보가 수정되었습니다!");
        } else {
          // [추가 모드] users/{userId}/words 아래에 새 단어 문서를 추가합니다.
          const wordsCollectionRef = collection(db, "users", currentUser.uid, "words");

          await addDoc(wordsCollectionRef, {
            english: english,
            korean: korean,
            example: example,
            memorized: false,
            createdAt: now,
            updatedAt: now
          });

          showToast("🎉 새 단어가 내 단어장에 추가되었습니다!");
        }

        // 입력 폼 초기화
        resetForm();
      } catch (error) {
        console.error("단어 저장 오류:", error);
        alert("단어를 저장하는 중 오류가 발생했습니다: " + error.message);
      } finally {
        submitWordBtn.disabled = false;
      }
    });

    // 수정 모드로 전환하는 함수
    function startEditWord(word) {
      editWordIdInput.value = word.id;
      englishInput.value = word.english || "";
      koreanInput.value = word.korean || "";
      exampleInput.value = word.example || "";

      formTitle.textContent = "✏️ 단어 내용 수정하기";
      submitWordBtn.textContent = "수정 내용 저장";
      cancelEditBtn.classList.remove("hidden");

      // 화면을 입력 폼 위치로 부드럽게 스크롤합니다.
      wordForm.scrollIntoView({ behavior: "smooth", block: "center" });
      englishInput.focus();
    }

    // 입력 폼을 초기 상태(새 단어 추가 모드)로 되돌리는 함수
    function resetForm() {
      wordForm.reset();
      editWordIdInput.value = "";
      formTitle.textContent = "✨ 새 영어 단어 추가하기";
      submitWordBtn.textContent = "+ 단어장에 저장";
      cancelEditBtn.classList.add("hidden");
    }

    cancelEditBtn.addEventListener("click", resetForm);

    // ========================================================================
    // 9. 암기 완료 상태 토글(Update) 및 단어 삭제(Delete) 처리
    // ========================================================================
    async function toggleMemorizedStatus(word) {
      if (!currentUser) return;
      try {
        const wordDocRef = doc(db, "users", currentUser.uid, "words", word.id);
        const nextStatus = !word.memorized;

        await updateDoc(wordDocRef, {
          english: word.english,
          korean: word.korean,
          example: word.example || "",
          memorized: nextStatus,
          createdAt: word.createdAt,
          updatedAt: Date.now()
        });

        showToast(nextStatus ? "✅ 암기 완료로 표시했습니다!" : "📖 다시 학습 중으로 변경했습니다.");
      } catch (error) {
        console.error("암기 상태 변경 오류:", error);
        alert("상태 변경 중 오류가 발생했습니다: " + error.message);
      }
    }

    async function removeWord(word) {
      if (!currentUser) return;
      const confirmed = confirm(`정말 "${word.english}" 단어를 삭제하시겠습니까?`);
      if (!confirmed) return;

      try {
        const wordDocRef = doc(db, "users", currentUser.uid, "words", word.id);
        await deleteDoc(wordDocRef);

        // 만약 수정 중이던 단어를 삭제했다면 입력 폼도 초기화합니다.
        if (editWordIdInput.value === word.id) {
          resetForm();
        }
        showToast("🗑️ 단어가 삭제되었습니다.");
      } catch (error) {
        console.error("단어 삭제 오류:", error);
        alert("단어 삭제 중 오류가 발생했습니다: " + error.message);
      }
    }

    // 브라우저 내장 음성 합성(TTS)으로 영어 발음 듣기 함수
    function speakEnglishWord(text) {
      if (!("speechSynthesis" in window)) {
        alert("현재 브라우저에서는 음성 발음 듣기를 지원하지 않습니다.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    // ========================================================================
    // 10. 화면에 단어 목록 그리기 (렌더링 및 검색/필터 적용)
    // ========================================================================
    function renderWordList() {
      // 1) 상단 통계 숫자 업데이트
      const totalCount = allWords.length;
      const memorizedCount = allWords.filter((w) => w.memorized).length;
      const learningCount = totalCount - memorizedCount;

      statTotal.textContent = totalCount;
      statMemorized.textContent = memorizedCount;
      statLearning.textContent = learningCount;

      // 2) 탭 필터('all' | 'learning' | 'memorized') 및 검색어 필터링
      const keyword = searchInput.value.trim().toLowerCase();
      const filteredWords = allWords.filter((word) => {
        if (currentFilter === "learning" && word.memorized) return false;
        if (currentFilter === "memorized" && !word.memorized) return false;

        if (keyword) {
          const matchEng = (word.english || "").toLowerCase().includes(keyword);
          const matchKor = (word.korean || "").toLowerCase().includes(keyword);
          const matchEx = (word.example || "").toLowerCase().includes(keyword);
          return matchEng || matchKor || matchEx;
        }
        return true;
      });

      // 3) 표시할 단어가 없을 때 빈 안내 문구 출력
      if (filteredWords.length === 0) {
        wordListContainer.innerHTML = `
          <div class="empty-state">
            ${totalCount === 0
            ? "아직 등록된 영어 단어가 없습니다. 위 입력창에서 첫 번째 단어를 추가해 보세요! 😊"
            : "선택한 조건이나 검색어에 맞는 단어가 없습니다."
          }
          </div>
        `;
        return;
      }

      // 4) 각 단어 카드를 HTML로 생성
      wordListContainer.innerHTML = filteredWords
        .map((word) => {
          const isDone = Boolean(word.memorized);
          return `
            <article class="word-card ${isDone ? "memorized" : ""}" data-id="${escapeHtml(word.id)}">
              <div>
                <div class="word-top">
                  <div class="word-english-wrap">
                    <span class="word-english">${escapeHtml(word.english)}</span>
                    <button
                      type="button"
                      class="speak-btn"
                      data-action="speak"
                      data-id="${escapeHtml(word.id)}"
                      title="영어 발음 듣기"
                    >🔊</button>
                  </div>
                  <span class="status-badge ${isDone ? "done" : "learning"}">
                    ${isDone ? "✓ 암기 완료" : "학습 중"}
                  </span>
                </div>

                <div class="word-korean">${escapeHtml(word.korean)}</div>

                ${word.example
              ? `<div class="word-example">"${escapeHtml(word.example)}"</div>`
              : ""
            }
              </div>

              <div class="word-footer">
                <button
                  type="button"
                  class="btn btn-outline btn-sm"
                  data-action="toggle"
                  data-id="${escapeHtml(word.id)}"
                >
                  ${isDone ? "↩ 다시 학습" : "✓ 암기 완료 체크"}
                </button>

                <div class="word-actions">
                  <button
                    type="button"
                    class="btn btn-outline btn-sm"
                    data-action="edit"
                    data-id="${escapeHtml(word.id)}"
                  >수정</button>
                  <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    data-action="delete"
                    data-id="${escapeHtml(word.id)}"
                  >삭제</button>
                </div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    // 단어 카드 내부의 버튼 클릭 이벤트 처리 (이벤트 위임 방식)
    wordListContainer.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-action]");
      if (!btn) return;

      const action = btn.dataset.action;
      const wordId = btn.dataset.id;
      const targetWord = allWords.find((w) => w.id === wordId);
      if (!targetWord) return;

      if (action === "speak") {
        speakEnglishWord(targetWord.english);
      } else if (action === "toggle") {
        toggleMemorizedStatus(targetWord);
      } else if (action === "edit") {
        startEditWord(targetWord);
      } else if (action === "delete") {
        removeWord(targetWord);
      }
    });

    // 탭 필터 버튼 클릭 이벤트
    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderWordList();
      });
    });

    // 검색창 입력 시 실시간 필터링
    searchInput.addEventListener("input", renderWordList);

    // '뜻 가리기(암기 테스트)' 버튼 토글
    blindToggleBtn.addEventListener("click", () => {
      isBlindMode = !isBlindMode;
      wordListContainer.classList.toggle("blind-mode", isBlindMode);
      blindToggleBtn.textContent = isBlindMode
        ? "👀 뜻 항상 보이기"
        : "🙈 뜻 가리기 (암기 테스트)";
      showToast(
        isBlindMode
          ? "뜻 가리기 모드가 켜졌습니다. 카드에 마우스를 올리면 뜻이 보입니다!"
          : "뜻 가리기 모드가 해제되었습니다."
      );
    });
  </script>
</body>

</html>
